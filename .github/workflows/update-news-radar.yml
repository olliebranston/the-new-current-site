name: Update news radar

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */12 * * *"
  push:
    paths:
      - "scripts/fetch_news_radar.py"
      - "scripts/validate_site.py"
      - "requirements.txt"
      - ".github/workflows/update-news-radar.yml"

jobs:
  update-news:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run news radar script
        run: python scripts/fetch_news_radar.py

      - name: Validate site data
        run: python scripts/validate_site.py

      - name: Commit updated news radar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news-radar.json
          git diff --cached --quiet || git commit -m "Update news radar"
          git pull --rebase origin main
          git push

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="Pipeline failure: ${{ github.workflow }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number')
          if [ -z "$EXISTING" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "Workflow run failed: $RUN_URL"
          else
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "Still failing as of $(date -u). Run: $RUN_URL"
          fi

      - name: Close resolved failure issue
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="Pipeline failure: ${{ github.workflow }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --repo "$GITHUB_REPOSITORY" --comment "Resolved as of $(date -u). Run: $RUN_URL"
          fi
