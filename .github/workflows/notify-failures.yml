name: Notify pipeline status

# Sends a Telegram message (via Robin's bot) when any site workflow starts
# failing, and again when it recovers. Only state changes are sent, so a
# half-hourly job that stays broken produces one alert, not 48 a day.
#
# Needs two repo secrets (Settings > Secrets and variables > Actions):
#   TELEGRAM_BOT_TOKEN  - Robin's bot token
#   TELEGRAM_CHAT_ID    - your chat id with Robin

on:
  workflow_run:
    workflows:
      - Generate RSS feed
      - Render static layout
      - Site quality
      - Update carbon data
      - Update comparison charts
      - Update generation mix data
      - Update green generation and bill data
      - Update live grid snapshot
      - Update news radar
      - Update power price data
      - Update sitemap
      - Update UK carbon accounting data
    types: [completed]

permissions:
  actions: read

jobs:
  notify:
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'failure' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Work out whether status changed
        id: state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          # Conclusion of the most recent completed run before this one.
          PREVIOUS=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW_ID}/runs?status=completed&per_page=10" \
            --jq "[.workflow_runs[] | select(.id != ${RUN_ID})][0].conclusion // \"none\"")
          echo "previous=$PREVIOUS current=$CONCLUSION"
          if [ "$CONCLUSION" = "failure" ] && [ "$PREVIOUS" != "failure" ]; then
            echo "send=failed" >> "$GITHUB_OUTPUT"
          elif [ "$CONCLUSION" = "success" ] && [ "$PREVIOUS" = "failure" ]; then
            echo "send=recovered" >> "$GITHUB_OUTPUT"
          else
            echo "send=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Send Telegram message
        if: steps.state.outputs.send != 'none'
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NAME: ${{ github.event.workflow_run.name }}
          URL: ${{ github.event.workflow_run.html_url }}
          STATE: ${{ steps.state.outputs.send }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "Telegram secrets not set - skipping notification."; exit 0
          fi
          if [ "$STATE" = "failed" ]; then
            TEXT="🔴 The New Current: '${NAME}' started failing. ${URL}"
          else
            TEXT="🟢 The New Current: '${NAME}' recovered. ${URL}"
          fi
          curl -sS --fail -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${TEXT}" \
            --data-urlencode "disable_web_page_preview=true" > /dev/null
